[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-windvane"
version = "0.1.0"
description = "正版网文公开榜单题材热度看板"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "jinja2>=3.1",
  "uvicorn>=0.27",
  "fonttools>=4.50",
  "brotli>=1.1",
  "pillow>=10.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "playwright>=1.49",
]

[project.scripts]
windvane = "book.cli:main"
fanqie-publish = "publish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book = ["data/*.npz", "web/templates/*.html", "web/static/*"]
